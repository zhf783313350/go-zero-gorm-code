apiVersion: v1
kind: Service
metadata:
  name: go-zero-gorm-code-service
  namespace: go-zero-gorm-code
  labels:
    app: go-zero-gorm-code-api
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: go-zero-gorm-code-api

---
# NodePort Service（用于外部访问）
apiVersion: v1
kind: Service
metadata:
  name: go-zero-gorm-code-nodeport
  namespace: go-zero-gorm-code
  labels:
    app: go-zero-gorm-code-api
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
      name: http
  selector:
    app: go-zero-gorm-code-api
