name: Go GitHub Actions CI/CD

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'  # 👈 1. 新增：只有推送以 v 开头的 tag（如 v1.0.0、v0.0.1）时，才算版本发布
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ==========================================
  # 阶段一：持续集成 (CI) - 自动测试与编译检查
  # 说明：每次 push/PR 到 main/master，或者 push tag 时，都会自动运行编译和测试
  # ==========================================
  go-ci-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Go environment
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Install dependencies
      run: go mod download

    - name: Build project
      run: go build -v ./...

    - name: Run automated tests
      run: go test -v -race ./...

  # ==========================================
  # 阶段二：持续部署 (CD) - 自动连上阿里云重启容器
  # 说明：只有在推送 v* 格式的 Tag 时，才会真正触发重启部署！
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    needs: go-ci-pipeline
    # 👈 2. 核心改动：限定只有触发事件是 Tag 推送且格式符合 v* 时才部署
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # 👈 3. 注意：删掉之前的 environment: production，这样就不需要手动点击 Approve 了！

    steps:
    - name: Deploy to Alibaba Cloud
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: 22
        script: |
          cd /home/go-zero-gorm-code
          
          # 严格拉取最新源码
          git pull origin master
          
          # 核心修复：加上 --no-cache，彻底粉碎 Docker 缓存
          docker compose build --no-cache
          docker compose up -d --force-recreate