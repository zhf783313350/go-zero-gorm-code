apiVersion: v1
kind: ServiceAccount
metadata:
  name: go-zero-gorm-code-sa
  namespace: go-zero-gorm-code
  labels:
    app: go-zero-gorm-code-api

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: go-zero-gorm-code-role
  namespace: go-zero-gorm-code
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: go-zero-gorm-code-rolebinding
  namespace: go-zero-gorm-code
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: go-zero-gorm-code-role
subjects:
  - kind: ServiceAccount
    name: go-zero-gorm-code-sa
    namespace: go-zero-gorm-code
